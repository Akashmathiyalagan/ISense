name: Test BIS catalogue RAG integration

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "Bis_model3/backend/rag/catalogue.py"
      - "Bis_model3/backend/rag/engine.py"
      - "Bis_model3/backend/tests/test_bis_catalogue.py"
      - "Bis_model3/backend/tests/test_rag_catalogue_integration.py"
      - ".github/workflows/test-catalogue-rag.yml"

permissions:
  contents: read

jobs:
  catalogue-rag-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Bis_model3/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt numpy pytest
      - name: Compile changed Python modules
        run: |
          python -m py_compile rag/catalogue.py rag/engine.py main.py
      - name: Run catalogue and scope guard tests
        run: |
          python -m pytest -q \
            tests/test_bis_catalogue.py \
            tests/test_rag_catalogue_integration.py \
            tests/test_rag_scope_guard.py
